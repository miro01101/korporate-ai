name: korporate-ai

x-default-logging: &default-logging
  driver: local
  options:
    max-size: "20m"
    max-file: "3"

services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    init: true
    shm_size: 128m

    environment:
      POSTGRES_DB: korporate_ai
      POSTGRES_USER: korporate_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_INITDB_ARGS: --data-checksums

    secrets:
      - postgres_admin_password
      - postgres_app_password_init

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro

    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=30
      - -c
      - timezone=UTC

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U korporate_admin -d korporate_ai
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

    mem_limit: 600m
    mem_reservation: 256m
    cpus: 0.50
    pids_limit: 200

    networks:
      - backend

    logging: *default-logging

  migration:
    image: korporate-ai-backend:0.3.0
    build:
      context: ./app/api

    profiles:
      - tools

    restart: "no"
    init: true

    command:
      - alembic
      - upgrade
      - head

    environment:
      APP_NAME: Korporate AI Logistics Platform
      APP_ENV: production
      APP_VERSION: 0.3.0

      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: korporate_ai
      DB_USER: korporate_admin
      DB_PASSWORD_FILE: /run/secrets/postgres_admin_password

    secrets:
      - postgres_admin_password

    depends_on:
      postgres:
        condition: service_healthy

    mem_limit: 256m
    cpus: 0.25
    pids_limit: 100

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    networks:
      - backend

    logging: *default-logging

  importer:
    image: korporate-ai-importer:0.4.0
    build:
      context: .
      dockerfile: app/importer/Dockerfile

    profiles:
      - tools

    restart: "no"
    init: true

    command:
      - --help

    mem_limit: 1024m
    cpus: 1.0
    pids_limit: 180

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    networks:
      - backend

    logging: *default-logging

  analytics-refresh:
    image: korporate-ai-importer:0.4.0
    build:
      context: .
      dockerfile: app/importer/Dockerfile

    profiles:
      - tools

    restart: "no"
    init: true

    entrypoint:
      - python
      - /app/scripts/refresh-analytics-marts.py

    command:
      - --db-password-file
      - /run/secrets/postgres_app_password

    secrets:
      - postgres_app_password

    depends_on:
      postgres:
        condition: service_healthy

    mem_limit: 1024m
    cpus: 1.0
    pids_limit: 180

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    networks:
      - backend

    logging: *default-logging

  analytics-validate:
    image: korporate-ai-importer:0.4.0
    build:
      context: .
      dockerfile: app/importer/Dockerfile

    profiles:
      - tools

    restart: "no"
    init: true

    entrypoint:
      - python
      - /app/scripts/validate-analytics-marts.py

    command:
      - --db-password-file
      - /run/secrets/postgres_app_password

    secrets:
      - postgres_app_password

    depends_on:
      postgres:
        condition: service_healthy

    mem_limit: 512m
    cpus: 0.50
    pids_limit: 100

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    networks:
      - backend

    logging: *default-logging


  ml:
    image: korporate-ai-ml:0.5.0
    build:
      context: .
      dockerfile: app/ml/Dockerfile

    profiles:
      - tools

    restart: "no"
    init: true

    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: korporate_ai
      DB_USER: korporate_app
      DB_PASSWORD_FILE: /run/secrets/postgres_app_password

      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
      ML_ARTIFACT_DIR: /artifacts

    secrets:
      - postgres_app_password

    # The DB secret is owned by root:10001 with mode 0440.
    # ML runs as UID/GID 10002 and receives only the
    # supplementary read-only secret group.
    group_add:
      - "10001"

    volumes:
      - /srv/korporate-ai/ml-artifacts:/artifacts

    depends_on:
      postgres:
        condition: service_healthy

    command:
      - self-check

    mem_limit: 1400m
    mem_reservation: 512m
    cpus: 1.25
    pids_limit: 180

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    networks:
      - backend

    logging: *default-logging

  api:
    image: korporate-ai-backend:0.5.0
    build:
      context: ./app/api

    restart: unless-stopped
    init: true

    environment:
      APP_NAME: Korporate AI Logistics Platform
      APP_ENV: production
      APP_VERSION: 0.5.0

      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: korporate_ai
      DB_USER: korporate_app
      DB_PASSWORD_FILE: /run/secrets/postgres_app_password

    secrets:
      - postgres_app_password

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "127.0.0.1:18000:8000"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8000/health/ready',
          timeout=3
          ).read()
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    mem_limit: 300m
    mem_reservation: 128m
    cpus: 0.30
    pids_limit: 100

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    networks:
      - edge
      - backend

    logging: *default-logging

  dashboard:
    image: korporate-ai-dashboard:0.4.0
    build:
      context: ./app/dashboard

    restart: unless-stopped
    init: true

    environment:
      APP_NAME: Korporate AI Logistics Platform
      APP_ENV: production
      APP_VERSION: 0.4.0
      DASHBOARD_AUTH_FILE: /run/secrets/dashboard_auth.json
      API_BASE_URL: http://api:8000
      HOME: /tmp

    depends_on:
      api:
        condition: service_healthy

    volumes:
      - type: bind
        source: /opt/korporate-ai/secrets/dashboard_auth.json
        target: /run/secrets/dashboard_auth.json
        read_only: true
        bind:
          create_host_path: false

    ports:
      - "127.0.0.1:18501:8501"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8501/_stcore/health',
          timeout=3
          ).read()
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

    mem_limit: 500m
    mem_reservation: 192m
    cpus: 0.40
    pids_limit: 150

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    networks:
      - edge

    logging: *default-logging

secrets:
  postgres_admin_password:
    file: ./secrets/postgres_admin_password

  postgres_app_password:
    file: ./secrets/postgres_app_password

  postgres_app_password_init:
    file: ./secrets/postgres_app_password_init

volumes:
  postgres_data:

networks:
  edge:
    driver: bridge

  backend:
    driver: bridge
    internal: true
